name: brewleaf_shop
description: Brew & Leaf - Flutter e-commerce app (Riverpod + Supabase) with admin and customer roles.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.9.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  shared_preferences: ^2.5.6

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
